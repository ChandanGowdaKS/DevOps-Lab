global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alert_rules.yml

scrape_configs:
  - job_name: "prometheus_internal"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "zapptto_dispatch_service"
    static_configs:
      - targets: ["host.docker.internal:8000"]
