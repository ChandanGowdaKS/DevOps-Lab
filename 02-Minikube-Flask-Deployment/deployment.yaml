apiVersion: apps/v1
kind: Deployment
metadata:
  name: zepto-catalog-deploy
  labels:
    app: zepto-catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zepto-catalog
  template:
    metadata:
      labels:
        app: zepto-catalog
    spec:
      containers:
      - name: catalog-app
        image: zepto-catalog:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
          name: http
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: zepto-catalog-svc
  labels:
    app: zepto-catalog
spec:
  type: NodePort
  selector:
    app: zepto-catalog
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
